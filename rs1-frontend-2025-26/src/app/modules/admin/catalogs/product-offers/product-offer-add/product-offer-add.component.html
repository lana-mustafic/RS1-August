<section class="form-page"><header><button mat-icon-button title="Nazad" (click)="cancel()"><mat-icon>arrow_back</mat-icon></button><h1>Nova promotivna ponuda</h1></header><form [formGroup]="form"><mat-form-field appearance="outline"><mat-label>Oznaka</mat-label><input matInput formControlName="code"></mat-form-field><mat-form-field appearance="outline"><mat-label>Proizvod</mat-label><mat-select formControlName="productId">@for(product of products; track product.id){<mat-option [value]="product.id">{{product.name}}</mat-option>}</mat-select></mat-form-field><mat-form-field appearance="outline"><mat-label>Popust (%)</mat-label><input matInput type="number" formControlName="discountPercent"></mat-form-field><mat-form-field appearance="outline"><mat-label>Vazi do</mat-label><input matInput [matDatepicker]="picker" formControlName="validUntilUtc"><mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle><mat-datepicker #picker></mat-datepicker></mat-form-field><div class="actions"><button mat-button type="button" (click)="cancel()">Odustani</button><button mat-flat-button color="primary" type="button" (click)="save()">Sacuvaj</button></div></form></section>
