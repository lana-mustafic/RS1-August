<section class="form-page"><header><button mat-icon-button title="Nazad" (click)="cancel()"><mat-icon>arrow_back</mat-icon></button><h1>Nova inventura</h1></header><form><div class="master"><mat-form-field appearance="outline"><mat-label>Broj inventure</mat-label><input matInput></mat-form-field><mat-form-field appearance="outline"><mat-label>Napomena</mat-label><textarea matInput rows="2"></textarea></mat-form-field></div><div class="items-header"><h2>Stavke inventure</h2><button mat-stroked-button type="button" (click)="addItem()"><mat-icon>add</mat-icon>Dodaj stavku</button></div><div class="items">@for(item of items.controls; track $index; let i=$index){<div class="item-row"><span class="index">{{i+1}}.</span><mat-form-field appearance="outline"><mat-label>Proizvod</mat-label><mat-select>@for(product of products;track product.id){<mat-option [value]="product.id">{{product.name}}</mat-option>}</mat-select></mat-form-field><div class="readonly">Evidentirano: -</div><div class="readonly">Cijena: -</div><mat-form-field appearance="outline"><mat-label>Prebrojano</mat-label><input matInput type="number"></mat-form-field><div class="readonly">Razlika: -</div><div class="readonly">Vrijednost: -</div><button mat-icon-button type="button" title="Ukloni" (click)="removeItem(i)"><mat-icon>delete</mat-icon></button></div>}</div><div class="summary">Ukupno odstupanje: <strong>-</strong></div><div class="actions"><button mat-button type="button" (click)="cancel()">Odustani</button><button mat-flat-button color="primary" type="button" (click)="save()">Sacuvaj</button></div></form></section>
